name: update-harian

# Cron harian HargaWatch: scrape harga kemarin -> upsert Supabase.
# CATATAN: scheduled workflow HANYA jalan di default branch (main).
# Bisa juga dijalankan manual: tab Actions -> update-harian -> Run workflow.

on:
  schedule:
    - cron: '30 22 * * *'   # 22:30 UTC = 05:30 WIB setiap hari
  workflow_dispatch: {}      # tombol "Run workflow" manual

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnostik TCP ke Supabase pooler
        run: |
          python - <<'EOF'
          import socket
          host = "${{ secrets.SUPABASE_HOST }}"
          for port in (6543, 5432):
              s = socket.socket(); s.settimeout(10)
              try:
                  s.connect((host, port))
                  print(f"{host}:{port} TERBUKA")
              except Exception as e:
                  print(f"{host}:{port} GAGAL: {type(e).__name__}")
              finally:
                  s.close()
          EOF

      - name: Jalankan update harian
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: python scripts/update_harian.py
