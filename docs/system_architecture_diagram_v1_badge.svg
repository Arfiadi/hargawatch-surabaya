<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" style="background:#ffffff; font-family:'Segoe UI', -apple-system, Roboto, sans-serif;">
  <defs>
    <!-- Arrow marker default -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <!-- Red alert arrow -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <!-- Blue arrow -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7" />
    </marker>
    <!-- Purple scheduler arrow -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED" />
    </marker>
    <!-- Shadow Filter -->
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ==================== 1. ZONA PENGGUNA (STAKEHOLDERS) - KIRI ==================== -->
  <rect x="35" y="30" width="315" height="300" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="50" y="52" font-size="12" font-weight="700" fill="#475569">ZONA PENGGUNA (STAKEHOLDERS)</text>

  <!-- AKTOR 1: Pemerintah Kota & Satgas Pangan -->
  <g transform="translate(48, 75)">
    <circle cx="38" cy="35" r="23" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
    <path d="M 20 25 Q 38 10 56 25 Z" fill="#1D4ED8"/>
    <rect x="17" y="24" width="42" height="4" rx="2" fill="#1E40AF"/>
    <path d="M 15 70 Q 38 46 61 70 Z" fill="#1D4ED8"/>
    <text x="38" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Pemerintah Kota &amp;</text>
    <text x="38" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Satgas Pangan (TPID)</text>
  </g>

  <!-- AKTOR 2: Masyarakat & Pelaku UMKM -->
  <g transform="translate(48, 200)">
    <circle cx="28" cy="35" r="19" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
    <path d="M 12 68 Q 28 48 44 68 Z" fill="#0284C7"/>
    <circle cx="50" cy="37" r="16" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
    <path d="M 37 68 Q 50 50 63 68 Z" fill="#16A34A"/>
    <text x="38" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Masyarakat Umum &amp;</text>
    <text x="38" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Pelaku UMKM / Pedagang</text>
  </g>

  <!-- TERMINAL 1: Bot Telegram (Sejajar Aktor 1) -->
  <g transform="translate(225, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="105" height="70" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <rect x="5" y="5" width="95" height="60" rx="3" fill="#FEF3C7"/>
    <circle cx="52" cy="33" r="15" fill="#0284C7"/>
    <path d="M 44 33 L 61 26 L 56 41 L 52 37 L 49 40 Z" fill="#FFFFFF"/>
    <rect x="45" y="70" width="15" height="12" fill="#D97706"/>
    <rect x="30" y="82" width="45" height="4" rx="2" fill="#D97706"/>
    <text x="52" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Bot Telegram</text>
  </g>

  <!-- Panah: Satgas <- Bot Telegram -->
  <line x1="225" y1="110" x2="135" y2="110" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="180" y="101" text-anchor="middle" font-size="10.5" font-weight="700" fill="#DC2626">Push Alert</text>

  <!-- TERMINAL 2: Web Browser (Sejajar Aktor 2) -->
  <g transform="translate(225, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="105" height="70" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <rect x="5" y="5" width="95" height="60" rx="3" fill="#FEF3C7"/>
    <rect x="10" y="12" width="36" height="18" rx="2" fill="#2563EB" opacity="0.8"/>
    <rect x="50" y="12" width="38" height="18" rx="2" fill="#059669" opacity="0.8"/>
    <path d="M 12 48 Q 30 38 48 44 T 88 36" fill="none" stroke="#D97706" stroke-width="2"/>
    <rect x="45" y="70" width="15" height="12" fill="#D97706"/>
    <rect x="30" y="82" width="45" height="4" rx="2" fill="#D97706"/>
    <text x="52" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">Web Browser</text>
  </g>

  <!-- Panah: Masyarakat -> Web Browser (Public View) -->
  <line x1="135" y1="245" x2="225" y2="245" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="180" y="237" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Public View</text>

  <!-- Panah: Pemerintah -> Web Browser (Government View) -->
  <path d="M 95 175 L 95 195 L 225 220" fill="none" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="145" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="#0284C7">Gov View</text>


  <!-- ==================== 2. ROW 1 (TOP): ALERTING & EWS ==================== -->

  <!-- MODUL 1: Alert Dispatcher (Col 2, Row 1) -->
  <g transform="translate(410, 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="58" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <text x="95" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">Modul Alert Dispatcher</text>
    <rect x="45" y="35" width="100" height="16" rx="4" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
    <text x="95" y="47" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">&#x25CF; BATCH HARIAN</text>
  </g>

  <!-- Panah: Alert Dispatcher -> Bot Telegram -->
  <line x1="410" y1="100" x2="340" y2="100" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="375" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Kirim Alert</text>

  <!-- MODUL 2: Early Warning System (Col 3, Row 1) -->
  <g transform="translate(710, 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="58" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <text x="110" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">Modul Early Warning System</text>
    <rect x="60" y="35" width="100" height="16" rx="4" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
    <text x="110" y="47" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">&#x25CF; BATCH HARIAN</text>
  </g>

  <!-- Panah: EWS -> Alert Dispatcher -->
  <line x1="710" y1="100" x2="610" y2="100" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="660" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Trigger Bahaya</text>


  <!-- ==================== 3. ROW 2 (MIDDLE): WEB APP, GOLD DB, & PERAMALAN ==================== -->

  <!-- MODUL 6: Web Dashboard (Col 2, Row 2) -->
  <g transform="translate(410, 208)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="58" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <text x="95" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">Modul Web Dashboard</text>
    <rect x="45" y="35" width="100" height="16" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    <text x="95" y="47" text-anchor="middle" font-size="9" font-weight="700" fill="#0369A1">&#x26A1; ON-DEMAND</text>
  </g>

  <!-- Panah: Web Dashboard <-> Web Browser -->
  <line x1="410" y1="237" x2="340" y2="237" stroke="#334155" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="375" y="227" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Akses Web</text>

  <!-- BASIS DATA 2: Database Hasil Gold Layer (Col 3, Row 2) -->
  <g transform="translate(770, 195)" filter="url(#shadow)">
    <g transform="translate(0, 0)">
      <path d="M 0 15 A 50 12 0 0 0 100 15 V 42 A 50 12 0 0 1 0 42 Z" fill="#2DD4BF" stroke="#0D9488" stroke-width="2"/>
      <ellipse cx="50" cy="15" rx="50" ry="12" fill="#5EEAD4" stroke="#0D9488" stroke-width="2"/>
    </g>
    <g transform="translate(10, -10)">
      <path d="M 0 15 A 50 12 0 0 0 100 15 V 42 A 50 12 0 0 1 0 42 Z" fill="#2DD4BF" stroke="#0D9488" stroke-width="2"/>
      <ellipse cx="50" cy="15" rx="50" ry="12" fill="#5EEAD4" stroke="#0D9488" stroke-width="2"/>
      <text x="50" y="30" text-anchor="middle" font-size="10.5" font-weight="700" fill="#042F2C">Gold Layer</text>
    </g>
    <text x="60" y="68" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F766E">Database Hasil</text>
  </g>

  <!-- Panah: EWS -> Gold DB -->
  <line x1="820" y1="127" x2="820" y2="185" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="828" y="158" text-anchor="start" font-size="10.5" font-weight="600" fill="#475569">Simpan Status EWS</text>

  <!-- Panah: Gold DB -> Web Dashboard -->
  <line x1="770" y1="237" x2="610" y2="237" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="690" y="227" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Prediksi &amp; EWS</text>

  <!-- MODUL 5: Modul Peramalan (Col 4, Row 2) -->
  <g transform="translate(990, 208)" filter="url(#shadow)">
    <rect x="0" y="0" width="195" height="58" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <text x="97" y="27" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350F">Modul Peramalan</text>
    <rect x="47" y="35" width="100" height="16" rx="4" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
    <text x="97" y="47" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">&#x25CF; BATCH HARIAN</text>
  </g>

  <!-- Panah: Peramalan -> Gold DB -->
  <line x1="990" y1="237" x2="880" y2="237" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="935" y="227" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Simpan Prediksi</text>

  <!-- Panah: Peramalan -> EWS -->
  <path d="M 1087 210 L 1087 100 L 940 100" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1030" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Proyeksi Risiko</text>


  <!-- ==================== 4. ROW 3 (BOTTOM): SCHEDULER, INGESTION, SILVER DB & REKAYASA FITUR ==================== -->
  <rect x="35" y="375" width="1170" height="280" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="50" y="398" font-size="12" font-weight="700" fill="#475569">PIPELINE DATA &amp; PENYIMPANAN</text>

  <!-- SUMBER DATA EKSTERNAL (Bawah Kiri - Dilengkapi SISKAPERBAPO, Open-Meteo & Kalender) -->
  <g transform="translate(48, 475)" filter="url(#shadow)">
    <rect x="0" y="0" width="185" height="84" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="92" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Sumber Data Eksternal</text>
    <text x="92" y="40" text-anchor="middle" font-size="10" fill="#475569">• SISKAPERBAPO (Harga Pasar)</text>
    <text x="92" y="56" text-anchor="middle" font-size="10" fill="#475569">• Open-Meteo (Cuaca Harian)</text>
    <text x="92" y="72" text-anchor="middle" font-size="10" fill="#475569">• Kalender (Libur &amp; Ramadan)</text>
  </g>

  <!-- Panah: Sumber Data -> Data Ingestion -->
  <line x1="233" y1="517" x2="310" y2="517" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="271" y="507" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Scrape</text>

  <!-- MODUL WINDOWS TASK SCHEDULER -->
  <g transform="translate(320, 410)" filter="url(#shadow)">
    <rect x="0" y="0" width="185" height="46" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
    <text x="92" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">Windows Task Scheduler</text>
    <text x="92" y="37" text-anchor="middle" font-size="10" font-weight="600" fill="#6D28D9">(Otomasi Batch Harian)</text>
  </g>

  <!-- Panah: Scheduler -> Modul Ingestion (Vertikal ke Bawah) -->
  <line x1="412" y1="456" x2="412" y2="480" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="420" y="472" text-anchor="start" font-size="9.5" font-weight="700" fill="#7C3AED">Trigger</text>

  <!-- MODUL 3: Data Ingestion (Bawah Tengah-Kiri) -->
  <g transform="translate(320, 488)" filter="url(#shadow)">
    <rect x="0" y="0" width="185" height="58" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <text x="92" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">Modul Data Ingestion</text>
    <rect x="42" y="35" width="100" height="16" rx="4" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
    <text x="92" y="47" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">&#x25CF; BATCH HARIAN</text>
  </g>

  <!-- Panah: Ingestion -> Silver DB -->
  <line x1="505" y1="517" x2="575" y2="517" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="540" y="507" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Simpan</text>

  <!-- BASIS DATA 1: Database Historis Silver Layer (Bawah Tengah) -->
  <g transform="translate(585, 470)" filter="url(#shadow)">
    <g transform="translate(0, 0)">
      <path d="M 0 16 A 50 12 0 0 0 100 16 V 46 A 50 12 0 0 1 0 46 Z" fill="#2DD4BF" stroke="#0D9488" stroke-width="2"/>
      <ellipse cx="50" cy="16" rx="50" ry="12" fill="#5EEAD4" stroke="#0D9488" stroke-width="2"/>
    </g>
    <g transform="translate(14, -14)">
      <path d="M 0 16 A 50 12 0 0 0 100 16 V 46 A 50 12 0 0 1 0 46 Z" fill="#2DD4BF" stroke="#0D9488" stroke-width="2"/>
      <ellipse cx="50" cy="16" rx="50" ry="12" fill="#5EEAD4" stroke="#0D9488" stroke-width="2"/>
    </g>
    <g transform="translate(28, -28)">
      <path d="M 0 16 A 50 12 0 0 0 100 16 V 46 A 50 12 0 0 1 0 46 Z" fill="#2DD4BF" stroke="#0D9488" stroke-width="2"/>
      <ellipse cx="50" cy="16" rx="50" ry="12" fill="#5EEAD4" stroke="#0D9488" stroke-width="2"/>
      <text x="50" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#042F2C">Silver Layer</text>
    </g>
    <text x="64" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F766E">Database Historis</text>
  </g>

  <!-- Panah: Silver DB -> Web Dashboard (Ortogonal Bersih dari Atas Database Historis) -->
  <path d="M 640 447 L 640 345 L 505 345 L 505 274" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="575" y="337" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Data Harga Historis</text>

  <!-- Panah: Silver DB -> Rekayasa Fitur (Lurus Horizontal ke Kanan) -->
  <line x1="725" y1="517" x2="980" y2="517" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="850" y="507" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Query Data Historis</text>

  <!-- MODUL 4: Rekayasa Fitur (Bawah Kanan) -->
  <g transform="translate(990, 488)" filter="url(#shadow)">
    <rect x="0" y="0" width="195" height="58" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
    <text x="97" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">Modul Rekayasa Fitur</text>
    <rect x="47" y="35" width="100" height="16" rx="4" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
    <text x="97" y="47" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">&#x25CF; BATCH HARIAN</text>
  </g>

  <!-- Panah: Rekayasa Fitur -> Peramalan (Lurus Vertikal ke Atas) -->
  <line x1="1087" y1="490" x2="1087" y2="274" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1095" y="380" text-anchor="start" font-size="10.5" font-weight="600" fill="#475569">Fitur Lags</text>


  <!-- ==================== 5. LEGENDA KOMPONEN ==================== -->
  <g transform="translate(35, 680)">
    <rect x="0" y="0" width="1170" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="20" y="26" font-size="12" font-weight="700" fill="#334155">Komponen Sistem:</text>
    
    <circle cx="160" cy="21" r="9" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
    <text x="176" y="25" font-size="11.5" fill="#475569">Aktor Pengguna</text>

    <rect x="290" y="13" width="22" height="16" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="320" y="25" font-size="11.5" fill="#475569">Terminal Pengguna (Browser &amp; Telegram)</text>

    <rect x="610" y="13" width="22" height="16" rx="3" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
    <text x="640" y="25" font-size="11.5" fill="#475569">Modul Aplikasi / Engine</text>

    <rect x="800" y="13" width="75" height="16" rx="4" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
    <text x="837" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6D28D9">&#x25CF; BATCH HARIAN</text>
    <text x="883" y="25" font-size="11" fill="#475569">Otomasi 07:00</text>

    <rect x="980" y="13" width="75" height="16" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    <text x="1017" y="25" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0369A1">&#x26A1; ON-DEMAND</text>
    <text x="1063" y="25" font-size="11" fill="#475569">Real-time Web</text>
  </g>

</svg>
